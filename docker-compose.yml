services:
  myhome:
    image: ghcr.io/davidep01/myhome:latest
    container_name: myhome
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Empty selects the startup default: direct LAN access unless an admin
      # token is configured. An explicit required/disabled value is respected.
      MYHOME_AUTH_MODE: ${MYHOME_AUTH_MODE:-}
      MYHOME_DB_PATH: /data/db.json
    ports:
      - "3001:3001"
    volumes:
      - myhome-data:/data

volumes:
  myhome-data:
